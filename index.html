<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Factory</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:#070a14;color:#fff}
.topbar{position:sticky;top:0;z-index:99;background:#0b1020;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b}
.logo{font-weight:900;color:#00e5f1;font-size:22px}
.bannerAd{background:#111827;border:1px dashed #334155;margin:12px;border-radius:12px;padding:14px;text-align:center;color:#94a3b8;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#11102e;border:1px solid #2a2a5a;border-radius:16px;padding:12px;position:relative}
.emoji{font-size:32px}
.old{text-decoration:line-through;color:#888;font-size:12px}
.new{font-weight:900;font-size:18px;color:#00ff88}
.badge{position:absolute;top:8px;left:8px;background:#ff0040;color:#fff;padding:2px 6px;border-radius:8px;font-size:11px}
.btn{width:100%;margin-top:8px;background:#7c3aed;color:#fff;border:0;border-radius:10px;padding:10px;font-weight:800}
</style>
</head>
<body>

<div class="topbar">
<div class="logo">🛒 Tech Factory</div>
<div style="font-size:12px;color:#22c55e">🔥 خصم اليوم</div>
</div>

<div class="bannerAd">Banner Ad - AdMob</div>
<div id="coursesGrid" class="grid"></div>
<div class="bannerAd">Banner Ad - AdMob</div>

<!-- صوت الفيديوهات / الدوسة -->
<audio id="clickSound" src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_2a6d6d8328.mp3?filename=click-button-140881.mp3" preload="auto"></audio>

<script>
// الـ 17 كورس - ده التغيير الوحيد
let COURSE = [
 {n:"Python من الصفر للاحتراف", p:550, a:99, e:"🐍", d:82},
 {n:"تطوير مواقع Web", p:500, a:149, e:"💻", d:70},
 {n:"تطبيقات اندرويد", p:450, a:199, e:"📱", d:55},
 {n:"فوتوشوب Photoshop", p:300, a:99, e:"🎨", d:67},
 {n:"Java من الصفر", p:500, a:149, e:"☕", d:70},
 {n:"جرافيك ديزاين", p:400, a:129, e:"🖌️", d:67},
 {n:"مونتاج فيديو", p:350, a:99, e:"🎬", d:71},
 {n:"Microsoft Office", p:250, a:79, e:"📊", d:68},
 {n:"كورس انجليزي كامل", p:600, a:199, e:"🇬🇧", d:66},
 {n:"اردوينو Arduino", p:500, a:199, e:"🔌", d:60},
 {n:"روبوتات", p:700, a:299, e:"🤖", d:57},
 {n:"ذكاء اصطناعي AI", p:800, a:349, e:"🧠", d:56},
 {n:"تحليل بيانات", p:600, a:249, e:"📈", d:58},
 {n:"شبكات", p:550, a:199, e:"🌐", d:63},
 {n:"امن سيبراني", p:900, a:399, e:"🔐", d:55},
 {n:"تطوير العاب", p:650, a:299, e:"🎮", d:54},
 {n:"تصميم 3D", p:700, a:349, e:"🧊", d:50}
];

function playSound(){
 let s=document.getElementById('clickSound');
 s.currentTime=0;
 s.play().catch(()=>{});
}

function render(){
 let g=document.getElementById('coursesGrid');
 g.innerHTML='';
 COURSE.forEach((c,i)=>{
   g.innerHTML+=`
   <div class="card">
     <div class="badge">-${c.d}%</div>
     <div class="emoji">${c.e}</div>
     <div style="font-weight:800;margin-top:6px;font-size:14px">${c.n}</div>
     <div class="old">${c.p} جنيه</div><div class="new">${c.a} جنيه</div>
     <button class="btn" onclick="playSound(); openPay(${i})">اشتري الآن</button>
   </div>`;
 });
}
function openPay(i){ alert('شراء: '+COURSE[i].n+' - '+COURSE[i].a+' جنيه'); }
render();
</script>
</body>
</html>
